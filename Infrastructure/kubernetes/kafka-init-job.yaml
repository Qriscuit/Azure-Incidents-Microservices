apiVersion: batch/v1
kind: Job

metadata:
  name: kafka-init
  namespace: incident-system

spec:
  template:
    spec:
      restartPolicy: OnFailure

      containers:
        - name: kafka-init
          image: apache/kafka:4.2.1

          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for Kafka..."

              until /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:9092 \
                --list > /dev/null 2>&1;
              do
                sleep 2
              done

              echo "Kafka is ready. Creating topic..."

              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:9092 \
                --create \
                --if-not-exists \
                --topic incident-events \
                --partitions 3 \
                --replication-factor 1

              echo "Kafka topic initialization complete."