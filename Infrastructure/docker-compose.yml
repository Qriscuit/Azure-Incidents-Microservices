services:

    kafka:
        image: apache/kafka:4.1.2
        container_name: incident-kafka

        ports:
            - "9092:9092"

        environment:

            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
            KAFKA_DELETE_TOPIC_ENABLE: "true"
    
    kafka-init:
        image: apache/kafka:4.1.2

        depends_on:
            - kafka

        entrypoint: ["/bin/bash", "-c"]

        command: >
            "
            echo 'Waiting for Kafka...';

            until /opt/kafka/bin/kafka-topics.sh
            --bootstrap-server kafka:29092
            --list > /dev/null 2>&1;
            do
                sleep 2;
            done;

            echo 'Kafka ready. Creating topic...';

            /opt/kafka/bin/kafka-topics.sh
            --bootstrap-server kafka:29092
            --create
            --if-not-exists
            --topic incident-events
            --partitions 3
            --replication-factor 1;

            echo 'Kafka initialization complete.';
            "
    
    postgres:
        image: postgres:18
        container_name: incident-postgres

        environment:
            POSTGRES_DB: incidentdb
            POSTGRES_USER: incidentuser
            POSTGRES_PASSWORD: incidentpass

        ports:
            - "5432:5432"

        volumes:
            - postgres-data:/var/lib/postgresql

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U incidentuser -d incidentdb"]
            interval: 5s
            timeout: 5s
            retries: 10

    producer:
        build:
            context: ../incident-producer/incident-producer

        container_name: incident-producer

        ports:
            - "8080:8080"

        environment:
            KAFKA_BOOTSTRAP_SERVERS: kafka:29092

        depends_on:
            kafka-init:
                condition: service_completed_successfully


    consumer:
        build:
            context: ../incident-consumer/incident-consumer

        container_name: incident-consumer

        ports:
            - "8081:8080"

        environment:
            KAFKA_BOOTSTRAP_SERVERS: kafka:29092

            DB_URL: jdbc:postgresql://postgres:5432/incidentdb
            DB_USERNAME: incidentuser
            DB_PASSWORD: incidentpass

        depends_on:
            kafka-init:
                condition: service_completed_successfully

            postgres:
                condition: service_healthy

volumes:
  postgres-data: