services:

    kafka:
        image: apache/kafka:4.1.2
        container_name: incident-kafka

        ports:
            - "9092:9092"

        environment:

            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
            KAFKA_DELETE_TOPIC_ENABLE: "true"
    
    postgres:
        image: postgres:18
        container_name: incident-postgres

        environment:
            POSTGRES_DB: incidentdb
            POSTGRES_USER: incidentuser
            POSTGRES_PASSWORD: incidentpass

        ports:
            - "5433:5432"

        volumes:
            - postgres-data:/var/lib/postgresql

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U incidentuser -d incidentdb"]
            interval: 5s
            timeout: 5s
            retries: 10


volumes:
  postgres-data: