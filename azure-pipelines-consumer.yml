      - azure-pipelines-consumer.yml

variables:
  acrName: azureincidentacr1999
  acrLoginServer: azureincidentacr1999.azurecr.io

  imageRepository: incident-consumer

  resourceGroup: rg-incident-dev
  aksCluster: aks-incident-dev
