  imageTag: $(Build.BuildId)

trigger:
  branches:
    include:
      - main

  paths:
    include:
      - Incident-Consumer/**
      - Infrastructure/kubernetes/consumer.yaml
      - azure-pipelines-consumer.yml


pool:
  vmImage: ubuntu-latest


variables:
  acrName: azureincidentacr1999
  acrLoginServer: azureincidentacr1999.azurecr.io
  imageRepository: incident-producer

  resourceGroup: rg-incident-dev
  aksCluster: aks-incident-dev
  namespace: incident-system

  imageTag: $(Build.BuildId)


stages:

  - stage: Build
    displayName: Build and Push

    jobs:
      - job: BuildConsumer

        steps:
          - checkout: self

          - task: Maven@4
            displayName: Test and Package Producer

            inputs:
              mavenPOMFile: Incident-Consumer/Incident-Consumer/pom.xml
              goals: clean package
              javaHomeOption: JDKVersion
              jdkVersionOption: '1.21'
              jdkArchitectureOption: x64

          - task: AzureCLI@2
            displayName: Build and Push Producer Image

            inputs:
              azureSubscription: incident-azure-connection
              scriptType: bash
              scriptLocation: inlineScript

              inlineScript: |
                az acr login --name $(acrName)

                docker build \
                  -t $(acrLoginServer)/$(imageRepository):$(imageTag) \
                  Incident-Consumer/Incident-Consumer

                docker push \
                  $(acrLoginServer)/$(imageRepository):$(imageTag)

  - stage: Deploy
    displayName: Deploy Consumer to AKS

    dependsOn: Build

    jobs:
      - deployment: DeployConsumer

        environment: incident-dev

        strategy:
          runOnce:
            deploy:

              steps:
                - checkout: self

                - task: KubernetesManifest@1
                  displayName: Deploy Consumer

                  inputs:
                    action: deploy

                    connectionType: azureResourceManager

                    azureSubscriptionConnection: incident-azure-connection
                    azureResourceGroup: $(resourceGroup)
                    kubernetesCluster: $(aksCluster)

                    namespace: $(namespace)

                    manifests: |
                      Infrastructure/kubernetes/consumer.yaml

                    containers: |
                      $(acrLoginServer)/$(imageRepository):$(imageTag)